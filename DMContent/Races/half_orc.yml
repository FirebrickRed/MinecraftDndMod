name: Half-Orc
creature_type: Humanoid
source_url: "https://dnd5e.fandom.com/wiki/Half-Orc"
description: Whether united under the leadership of a mighty warlock or having fought to a standstill after years of conflict, orc and human tribes sometimes form alliances, joining forces into a larger horde to the terror of civilized lands nearby. When these alliances are sealed by marriages, half-orcs are born.
ability_scores:
  fixed:
    Strength: 2
    Constitution: 1
size: Medium
speed: 30
custom_model: half_orc_icon

# Display-only trait names
traits:
  - Darkvision
  - Menacing
  - Relentless Endurance
  - Savage Attacks

languages:
  - Common
  - Orc

# Mechanical trait implementations
darkvision: 60  # 60 ft. darkvision range

# Menacing: Proficiency in Intimidation
skill_proficiencies:
  - intimidation

# Relentless Endurance & Savage Attacks (Effect Engine passives, #70). Both are always on:
#  - endure_below_1: dropping to 0 HP (not killed outright) leaves you at 1 instead, 1×/long rest.
#  - extra_crit_die: a melee-weapon crit rolls one extra weapon die.
features:
  - id: relentless_endurance
    name: Relentless Endurance
    activation: passive
    apply:
      effects:
        endure_below_1: true
  - id: savage_attacks
    name: Savage Attacks
    activation: passive
    apply:
      effects:
        extra_crit_die: true