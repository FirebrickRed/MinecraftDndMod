name: Giff
creature_type: Humanoid
source_url: "https://www.dndbeyond.com/races/giff"
description: Giff are bipedal hippopotamus-like folk with a passion for explosives, military structure, and strength. They are known for their brute power and discipline, often serving in astral navies.
ability_scores:
  choice:
    distributions:
      - [2, 1]
      - [1, 1, 1]
size: Medium
speed: 30
custom_model: giff_icon

# Display-only trait names
traits:
  - Damage Dealer
  - Firearm Mastery
  - Hippo Build

languages:
  - Common

# Player choices during character creation
player_choices:
  - id: race_languages
    title: Languages
    type: LANGUAGE
    choose: 1
    options: []

# Mechanical trait implementations
# Hippo Build: Swimming speed equal to walking speed
swimming_speed: 30

# Hippo Build: advantage on every Strength check and Strength save (and you count as Large for
# carrying capacity). A feature, so the sheet and combat rolls both see it, like Rage's advantage.
features:
  - id: hippo_build
    name: Hippo Build
    activation: passive
    apply:
      effects:
        advantage_on: [str_checks, str_saves]

# Firearm Mastery: Proficiency with firearms, no loading property penalty
# (Requires firearm system - Issue #63)
firearm_mastery: true