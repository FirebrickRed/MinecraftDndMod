name: Dragonborn
creature_type: Humanoid
source_url: "https://dnd5e.fandom.com/wiki/Dragonborn"
description: Born of dragons, as their name proclaims, the dragonborn walk proudly through a world that greets them with fearful incomprehension. Shaped by draconic gods or the dragons themselves, dragonborn originally hatched from dragon eggs as a unique race.
# PHB dragonborn. For the Fizban's Treasury of Dragons version, comment out the lines marked
# "PHB" below and uncomment the "Fizban's" ones next to them: ability scores, breath weapon uses,
# breath damage. Then /dm reload.
ability_scores:
  fixed:              # PHB
    Strength: 2       # PHB
    Charisma: 1       # PHB
  # choice:           # Fizban's: +2/+1 or +1/+1/+1 anywhere
  #   distributions:
  #     - [2, 1]
  #     - [1, 1, 1]
size: Medium
speed: 30
custom_model: dragonborn_icon

# Display-only trait names (for character sheet)
traits:
  - Draconic Ancestry
  - Breath Weapon
  - Damage Resistance

languages:
  - Common
  - Draconic

# Player choices during character creation
player_choices:
  - id: draconic_ancestry
    title: Draconic Ancestry
    type: CUSTOM
    choose: 1
    options:
      - { label: "Black (Acid, 5x30 ft. line, DEX save)", grants: { damage_resistances: [acid] } }
      - { label: "Blue (Lightning, 5x30 ft. line, DEX save)", grants: { damage_resistances: [lightning] } }
      - { label: "Brass (Fire, 5x30 ft. line, DEX save)", grants: { damage_resistances: [fire] } }
      - { label: "Bronze (Lightning, 5x30 ft. line, DEX save)", grants: { damage_resistances: [lightning] } }
      - { label: "Copper (Acid, 5x30 ft. line, DEX save)", grants: { damage_resistances: [acid] } }
      - { label: "Gold (Fire, 15 ft. cone, DEX save)", grants: { damage_resistances: [fire] } }
      - { label: "Green (Poison, 15 ft. cone, CON save)", grants: { damage_resistances: [poison] } }
      - { label: "Red (Fire, 15 ft. cone, DEX save)", grants: { damage_resistances: [fire] } }
      - { label: "Silver (Cold, 15 ft. cone, CON save)", grants: { damage_resistances: [cold] } }
      - { label: "White (Cold, 15 ft. cone, CON save)", grants: { damage_resistances: [cold] } }

# Each ancestry option grants its resistance (#222); the breath weapon below picks its variant by the same label.

# Breath Weapon (Effect Engine action, #70): activate with /combat use breath_weapon on your turn.
# PHB: once per short or long rest. The shape, save, and damage type come from the
# draconic ancestry the player picked at creation — a variant per option, resolved by `by_choice`.
# Homebrew: add a new ancestry option + a matching variant here; no code change needed.
features:
  - id: breath_weapon
    name: Breath Weapon
    activation: action
    cost: { resource: breath_weapon, amount: 1, max: 1, recovery: short_rest }                    # PHB
    # cost: { resource: breath_weapon, amount: 1, max: proficiency_bonus, recovery: long_rest }  # Fizban's
    action:
      dc_ability: constitution   # DC = 8 + proficiency bonus + CON modifier
      save_effect: half          # a successful save takes half damage
      damage: 2d6                # PHB, 1st level (3d6 at 6th, 4d6 at 11th, 5d6 at 16th; scaling waits on level-up)
      # damage: 1d10             # Fizban's, 1st level (and it replaces one attack rather than the whole action)
      targets: enemies
      by_choice: draconic_ancestry
      variants:
        "Black (Acid, 5x30 ft. line, DEX save)":     { shape: line, size: 30, save: dexterity,   damage_type: acid }
        "Blue (Lightning, 5x30 ft. line, DEX save)": { shape: line, size: 30, save: dexterity,   damage_type: lightning }
        "Brass (Fire, 5x30 ft. line, DEX save)":     { shape: line, size: 30, save: dexterity,   damage_type: fire }
        "Bronze (Lightning, 5x30 ft. line, DEX save)": { shape: line, size: 30, save: dexterity, damage_type: lightning }
        "Copper (Acid, 5x30 ft. line, DEX save)":    { shape: line, size: 30, save: dexterity,   damage_type: acid }
        "Gold (Fire, 15 ft. cone, DEX save)":        { shape: cone, size: 15, save: dexterity,   damage_type: fire }
        "Green (Poison, 15 ft. cone, CON save)":     { shape: cone, size: 15, save: constitution, damage_type: poison }
        "Red (Fire, 15 ft. cone, DEX save)":         { shape: cone, size: 15, save: dexterity,   damage_type: fire }
        "Silver (Cold, 15 ft. cone, CON save)":      { shape: cone, size: 15, save: constitution, damage_type: cold }
        "White (Cold, 15 ft. cone, CON save)":       { shape: cone, size: 15, save: constitution, damage_type: cold }