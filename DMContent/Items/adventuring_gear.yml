# Adventuring gear, tools, packs, clothing and background keepsakes.
# Everything a class or background starting kit hands out lives here (or in another Items/ file) —
# an id that isn't defined arrives as an "Unknown item" paper, and the content check on /dm reload
# names it. Field reference: docs/authoring-items.md
#
# Packs are single items for now (opening one into its contents isn't a feature).
# Tools here ARE the tool proficiencies: an item tagged `tool` (or artisan_tool, musical_instrument,
# gaming_set) registers as a tool, and a proficiency names its item id (see Items/tools.yml).

# ==================== TOOLS & KITS ====================

thieves_tools:
  name: "Thieves' Tools"
  type: "spellcasting_focus"      # the artificer's focus (it does nothing for other classes)
  focus_type: "thieves_tools"
  description: "A small file, a set of lock picks, a small mirror on a metal handle, a set of narrow-bladed scissors, and a pair of pliers. Proficiency lets you add your proficiency bonus to checks to disarm traps or open locks."
  material: "TRIPWIRE_HOOK"
  tags: [tool]
  cost: { amount: 25, currency: gold }

disguise_kit:
  name: "Disguise Kit"
  type: "tool"
  description: "Cosmetics, hair dye, and small props that let you create disguises that change your physical appearance."
  material: "LEATHER_HELMET"
  tags: [tool]
  cost: { amount: 25, currency: gold }

forgery_kit:
  name: "Forgery Kit"
  type: "tool"
  description: "Papers and parchments, pens and inks, seals and sealing wax, gold and silver leaf — everything needed to create convincing forgeries of physical documents."
  material: "FEATHER"
  tags: [tool]
  cost: { amount: 15, currency: gold }

healers_kit:
  name: "Healer's Kit"
  type: "gear"          # not a tool proficiency in 5e — anyone can use it
  description: "A leather pouch of bandages, salves, and splints. It has ten uses. As an action, you can expend one use to stabilize a creature that has 0 hit points, without a Wisdom (Medicine) check."
  material: "PAPER"
  cost: { amount: 5, currency: gold }

spellbook:
  name: "Spellbook"
  type: "gear"
  description: "A leather-bound tome of 100 blank vellum pages, suitable for recording wizard spells."
  material: "WRITTEN_BOOK"
  cost: { amount: 50, currency: gold }

