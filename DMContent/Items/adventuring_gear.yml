# ==================== ADVENTURING GEAR ====================

backpack:
  name: "Backpack"
  type: "gear"
  description: "A leather pack that holds 1 cubic foot or 30 pounds of gear."
  material: "BUNDLE"
  cost: { amount: 2, currency: gold }

ball_bearings:
  name: "Ball Bearings (bag of 1,000)"
  type: "gear"
  description: "Spilled as an action, they cover a 10-foot square. A creature moving across it must succeed on a DC 10 Dexterity saving throw or fall prone."
  material: "IRON_NUGGET"
  cost: { amount: 1, currency: gold }

bedroll:
  name: "Bedroll"
  type: "gear"
  description: "A padded roll for sleeping on hard ground."
  material: "WHITE_CARPET"
  cost: { amount: 1, currency: gold }

bullseye_lantern:
  name: "Bullseye Lantern"
  type: "gear"
  description: "Casts bright light in a 60-foot cone and dim light for an additional 60 feet. Burns for 6 hours on a flask of oil."
  material: "LANTERN"
  cost: { amount: 10, currency: gold }

caltrops:
  name: "Caltrops (bag of 20)"
  type: "gear"
  description: "Spread as an action over a 5-foot square. A creature entering it must succeed on a DC 15 Dexterity saving throw or take 1 piercing damage and stop moving; its speed drops by 10 feet until it regains a hit point."
  material: "IRON_NUGGET"
  cost: { amount: 1, currency: gold }

crowbar:
  name: "Crowbar"
  type: "gear"
  description: "Using a crowbar grants advantage to Strength checks where its leverage can be applied."
  material: "IRON_HOE"
  cost: { amount: 2, currency: gold }

grappling_hook:
  name: "Grappling Hook"
  type: "gear"
  description: "An iron hook for anchoring a rope to a ledge or rail."
  material: "TRIPWIRE_HOOK"
  cost: { amount: 2, currency: gold }

hempen_rope:
  name: "Hempen Rope (50 feet)"
  type: "gear"
  description: "50 feet of rope. It has 2 hit points and can be burst with a DC 17 Strength check."
  material: "LEAD"
  cost: { amount: 1, currency: gold }

hooded_lantern:
  name: "Hooded Lantern"
  type: "gear"
  description: "Casts bright light in a 30-foot radius and dim light for an additional 30 feet. Burns for 6 hours on a flask of oil. Lower the hood as an action to reduce the light to dim light in a 5-foot radius."
  material: "LANTERN"
  cost: { amount: 5, currency: gold }

miners_pick:
  name: "Miner's Pick"
  type: "gear"
  description: "A heavy pick for breaking rock."
  material: "IRON_PICKAXE"
  cost: { amount: 2, currency: gold }

potion_of_healing:
  name: "Potion of Healing"
  type: "potion"
  description: "You regain 2d4 + 2 hit points when you drink this potion. Drinking it takes an action."
  material: "POTION"
  healing: "2d4+2"     # drinkable: click it and the game fills in /character drink
  tags: [potion]
  cost: { amount: 50, currency: gold }

potion_of_greater_healing:
  name: "Potion of Greater Healing"
  type: "potion"
  description: "You regain 4d4 + 4 hit points when you drink this potion. Drinking it takes an action."
  material: "POTION"
  healing: "4d4+4"
  tags: [potion]
  cost: { amount: 100, currency: gold }

rations:
  name: "Rations (1 day)"
  type: "gear"
  description: "Dry foods suitable for extended travel, including jerky, dried fruit, hardtack, and nuts."
  material: "BREAD"
  cost: { amount: 5, currency: silver }

shovel:
  name: "Shovel"
  type: "gear"
  description: "A sturdy iron-bladed shovel."
  material: "IRON_SHOVEL"
  cost: { amount: 2, currency: gold }

silk_rope:
  name: "Silk Rope (50 feet)"
  type: "gear"
  description: "50 feet of light, strong silk rope. It has 2 hit points and can be burst with a DC 17 Strength check."
  material: "STRING"
  cost: { amount: 10, currency: gold }

tinderbox:
  name: "Tinderbox"
  type: "gear"
  description: "Flint, fire steel, and tinder. Lighting a torch with it takes an action; lighting any other fire takes 1 minute."
  material: "FLINT_AND_STEEL"
  cost: { amount: 5, currency: silver }

torch:
  name: "Torch"
  type: "gear"
  description: "Burns for 1 hour, shedding bright light in a 20-foot radius and dim light for an additional 20 feet. (Place it for real Minecraft light.)"
  material: "TORCH"
  cost: { amount: 1, currency: copper }

two_person_tent:
  name: "Two-Person Tent"
  type: "gear"
  description: "A simple, portable canvas shelter that sleeps two."
  material: "WHITE_BANNER"
  cost: { amount: 2, currency: gold }

waterskin:
  name: "Waterskin"
  type: "gear"
  description: "A leather skin that holds 4 pints of liquid."
  material: "POTION"
  cost: { amount: 2, currency: silver }

whetstone:
  name: "Whetstone"
  type: "gear"
  description: "A fine-grained stone for keeping a blade sharp."
  material: "FLINT"
  cost: { amount: 1, currency: copper }

