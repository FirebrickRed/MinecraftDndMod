# Musical instruments — the bard's spellcasting focus. Each is a spellcasting_focus with
# focus_type: musical_instrument (matching bard.yml's spellcasting_focus_type), and carries the
# `musical_instrument` tag so an equipment choice can offer "any instrument".

bagpipes:
  name: "Bagpipes"
  type: "spellcasting_focus"
  focus_type: "musical_instrument"
  description: "A bag and drone pipes; loud enough to be heard across a battlefield."
  material: "LEATHER"
  tags: [musical_instrument]
  cost: { amount: 30, currency: gold }

drum:
  name: "Drum"
  type: "spellcasting_focus"
  focus_type: "musical_instrument"
  description: "A hand drum of stretched hide."
  material: "NOTE_BLOCK"
  tags: [musical_instrument]
  cost: { amount: 6, currency: gold }

