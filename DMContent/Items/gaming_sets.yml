# Gaming sets — grouped by the `gaming_set` tag (#54). Anything with `tags: [gaming_set]` is offered
# wherever a "gaming set" equipment/tool choice appears (e.g. the Noble background). Add a homebrew
# set the same way — just give it the tag.

dice_set:
  name: "Dice Set"
  type: "gaming_set"
  description: "A set of dice for games of chance."
  material: "bone"
  tags:
    - gaming_set
  cost:
    amount: 1
    currency: silver

playing_card_set:
  name: "Playing Card Set"
  type: "gaming_set"
  description: "A deck of cards for games of chance and skill."
  material: "paper"
  tags:
    - gaming_set
  cost:
    amount: 5
    currency: silver

dragonchess_set:
  name: "Dragonchess Set"
  type: "gaming_set"
  description: "A three-tiered board and carved pieces for the game of dragonchess."
  material: "ITEM_FRAME"
  tags:
    - gaming_set
  cost:
    amount: 1
    currency: gold

three_dragon_ante_set:
  name: "Three-Dragon Ante Set"
  type: "gaming_set"
  description: "A deck of cards for Three-Dragon Ante, the gambling game of dragons and wagers."
  material: "PAPER"
  tags:
    - gaming_set
  cost:
    amount: 1
    currency: gold
