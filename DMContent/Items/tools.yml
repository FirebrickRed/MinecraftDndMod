# Tools — the items that ARE tool proficiencies.
#
# A tool proficiency names an item id: `tool_proficiencies: [smiths_tools]` means proficiency with
# the item below. Any item carrying one of these tags registers as a tool on every load:
#   artisan_tool        — Smith's Tools, Cook's Utensils, … (a "choose an artisan's tool" pick)
#   musical_instrument  — Items/musical_instruments.yml
#   gaming_set          — Items/gaming_sets.yml
#   tool                — the other kits (Thieves' Tools, Herbalism Kit, …)
# So a homebrew tool is just an item with the tag: it shows up in "choose any artisan's tool"
# picks, and the content check stops flagging proficiencies that name it.
# Vehicles (land / water / air / space) are the only tools that aren't items — see ToolRegistry.
#
# Prices are PHB p.154. Field reference: docs/authoring-items.md

