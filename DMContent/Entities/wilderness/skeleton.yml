# SRD Skeleton. An undead, so it's what Divine Sense finds and Lay on Hands can't heal (#229).
id: skeleton
name: "Skeleton"

creature_type: undead
size: medium

hit_points: 13
hit_dice: "2d8+4"
armor_class: 13     # armor scraps
speed: 30
darkvision: 60

abilities:
  strength: 10
  dexterity: 14
  constitution: 15
  intelligence: 6
  wisdom: 8
  charisma: 5

damage_vulnerabilities: [bludgeoning]
damage_immunities: [poison]
condition_immunities: [poisoned]

attacks:
  - name: "Shortsword"
    item: shortsword       # held when a DM possesses it, and left on the body as loot
    to_hit: 4
    reach: "5 ft."
    damage: "1d6+2"
    damage_type: piercing
  - name: "Shortbow"
    item: shortbow         # carries 2d10 arrows by default, rolled when it spawns (#257)
    to_hit: 4
    reach: "80/320 ft."
    damage: "1d6+2"
    damage_type: piercing

# Stat block lines the game doesn't model: kept here so they're in front of the DM (/dm view).
dm_notes: |
  CR 1/4 (50 XP). Passive Perception 9.
  Understands the languages it knew in life but can't speak.
  Exhaustion immune too (exhaustion isn't in the game yet).
