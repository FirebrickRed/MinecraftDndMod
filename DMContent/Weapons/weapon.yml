# ── Reach weapons ────────────────────────────────────────────────────────────────────────────
# The `reach:` key is the weapon's melee reach in feet. Omit it and a melee weapon is 5 ft — so
# every existing weapon keeps working untouched. The Reach property in 5e adds 5 ft, giving these
# 10 ft; homebrew can put any number here (a 15 ft polearm is just `reach: 15`).
#
# This is distinct from `range:`, which is how far a RANGED or THROWN weapon travels (normal/long).
# A weapon can have both: reach is how far you can stab, range is how far you can throw.

glaive:
  name: "Glaive"
  category: "martial"
  type: "melee"
  damage: "1d10"
  damage_type: "slashing"
  properties: ["heavy", "reach", "two-handed"]
  reach: 10
  weight: "6 lb"
  cost:
    amount: 20
    currency: gold
  description: "A long polearm with a single-edged blade. Strikes at 10 feet."
  material: IRON_AXE

halberd:
  name: "Halberd"
  category: "martial"
  type: "melee"
