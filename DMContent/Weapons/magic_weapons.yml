# Magic weapons (#188). A magic weapon names its mundane `base:` and adds a `magic:` block; the loader
# merges in the base's dice, damage type, properties, range, material and model, so only what's
# different is written here. Name, cost and description are NOT inherited.
#
#   longsword_plus_2:
#     base: longsword
#     rarity: rare                  # common | uncommon | rare | very_rare | legendary | artifact
#     magic:
#       bonus: 2                    # shorthand for attack_bonus: 2 + damage_bonus: 2
#       # attack_bonus: 1           # or set them separately
#       # damage_bonus: 1
#       # crit_bonus_damage: 7      # extra damage on a natural 20 (Vicious Weapon)
#
# No `name:` on a +N weapon → "Longsword +2" from the base's name. The bonus is added to attack rolls
# whether or not the wielder is proficient (DMG); proficiency still comes from the base (a Longsword +2
# is a longsword). Magic weapons stay out of the simple/martial weapon tags, so starting kits never
# offer them. No prices: DMG values are far over the 64-coin trade limit (#94) — they're loot for now.
# Full reference: docs/authoring-items.md → Magic weapons.
#
# Weapon, +1 / +2 / +3 (DMG p.213): uncommon / rare / very rare. No attunement.

longsword_plus_1:
  base: longsword
  rarity: uncommon
  magic: { bonus: 1 }
  description: "You have a +1 bonus to attack and damage rolls made with this magic weapon."

longsword_plus_2:
  base: longsword
  rarity: rare
  magic: { bonus: 2 }
  description: "You have a +2 bonus to attack and damage rolls made with this magic weapon."

longsword_plus_3:
