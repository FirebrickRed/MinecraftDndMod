# Vicious Weapon (DMG p.209, 2014): rare, no attunement. "When you roll a 20 on your attack roll with
# this magic weapon, the target takes an extra 7 damage of the weapon's type."
vicious_longsword:
  name: "Vicious Longsword"
  base: longsword
  rarity: rare
  magic: { crit_bonus_damage: 7 }
  description: "When you roll a 20 on your attack roll with this magic weapon, the target takes an extra 7 damage of the weapon's type."

