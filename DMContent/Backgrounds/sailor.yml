sailor:
  name: Sailor
  description: "You sailed on a seagoing vessel for years. You've weathered mighty storms, faced sea monsters, and stared down the crews of rival ships."
  skill_proficiencies:
    - athletics
    - perception
  tool_proficiencies:
    - navigators_tools
    - vehicles_water
  starting_equipment:
    - belaying_pin
    - silk_rope
    - lucky_charm
    - common_clothes
    - gold_piece x10
  feature:
    name: Ship's Passage
    description: "When you need to, you can secure free passage on a sailing ship for yourself and your companions — through a ship you sailed on or someone you know. You might be expected to help the crew during the voyage."
  links:
    - "https://dnd5e.wikidot.com/background:sailor"
