urchin:
  name: Urchin
  description: "You grew up on the streets alone, orphaned, and poor, surviving on wits and the kindness of strangers."
  skill_proficiencies:
    - sleight_of_hand
    - stealth
  tool_proficiencies:
    - disguise_kit
    - thieves_tools
  starting_equipment:
    - small_knife
    - city_map
    - pet_mouse
    - common_clothes
    - gold_piece x10
    # The "token to remember your parents by" is the Keepsake choice below.
  player_choices:
    - id: urchin_keepsake
      title: Keepsake
      type: equipment
      choose: 1
      options:
        - keepsake      # any item tagged 'keepsake' (see Items/keepsakes.yml); auto-expands
  feature:
    name: City Secrets
    description: "You know the secret patterns and flow of cities and can find passages through the urban sprawl that others would miss. When you are not in combat, you and companions you lead can travel between any two locations in a city twice as fast as your speed would normally allow."
  links:
    - "https://www.dndbeyond.com/backgrounds/urchin"
