# Gear goes under `starting_equipment:` (plain ids, "id xN" for a quantity). Coin is gold_piece —
# e.g. "gold_piece x15" for the classic belt pouch of 15 gp. Every id must exist in Items/Weapons/Armor
# (Items/adventuring_gear.yml holds the background keepsakes).

acolyte:
  name: Acolyte
  description: ""
  skill_proficiencies:
    - insight
    - religion
  starting_equipment:
    - holy_symbol
    - prayer_book
    - vestments
    - common_clothes
    - sticks_of_incense x5
    - gold_piece x15
  feature: "Shelter of the Faithful"
  traits: [acolyte]
  player_choices:
    - id: background_language
      title: Background Language
      type: language
      choose: 2
      options: []
  links:
    - "https://dnd5e.wikidot.com/background:acolyte"

anthropologist:
  name: Anthropologist
  description: ""
  skill_proficiencies:
    - insight
    - religion
  starting_equipment:
    - diary
    - bottle_of_ink
    - ink_pen
    - travelers_clothes
    - trinket
    - gold_piece x10
  player_choices:
    - id: background_language
      title: Background Language
      type: language
      choose: 2
      options: []
#  ToDo: some have more than one feature
  feature: "Cultural Chameleon"
  traits: [cultural_chameleon, adept_linguist]
  links:
    - "https://dnd5e.wikidot.com/background:anthropologist"

archaeologist:
  name: Archaeologist
  description: ""
  skill_proficiencies:
    - history
    - survival
  starting_equipment:
    - wooden_case
    - map_to_ruin_or_dungeon   # kept inside the wooden case
    - bullseye_lantern
    - miners_pick
    - travelers_clothes
    - shovel
    - two_person_tent
    - trinket
    - gold_piece x25
  player_choices:
    - id: background_tool_proficiencies
      title: Background Tool Proficiencies
      type: tool
      choose: 1
      options: ["cartographer's tools", "navigator's tools"]
    - id: background_language
      title: Background Language
      type: language
      choose: 1
      options: []
  feature: ""
  traits: [dust_digger, historical_knowledge]
  links: ["https://dnd5e.wikidot.com/background:archaeologist"]

athlete:
  name: Athlete
  description: ""
  skill_proficiencies:
    - acrobatics
    - athletics
  tool_proficiencies:
    - vehicles(land)
  starting_equipment:
    - leather_ball
    - lucky_charm
    - travelers_clothes
    - gold_piece x10
  player_choices:
    - id: background_language
      title: Background Language
      type: language
      choose: 1
      options: []
  feature: ""
  traits: [echoes_of_victory]
  links: ["https://dnd5e.wikidot.com/background:athlete"]

charlatan:
  name: Charlatan
  description: ""
  skill_proficiencies:
    - deception
    - sleight_of_hand
  tool_proficiencies:
    - disguise_kit
    - forgery_kit
  starting_equipment:
    - fine_clothes
    - disguise_kit
    - gold_piece x15
  feature: ""
  traits: [false_identity]
  links: ["https://dnd5e.wikidot.com/background:charlatan"]
