# The rest of the 2014 PHB backgrounds (#206). Each root key is a background id.
# Field reference: docs/authoring-backgrounds.md
#
# `also_give: true` on a tool pick grants the picked tool as an item too — the Guild Artisan's
# "proficiency with one artisan's tool" and "a set of artisan's tools" are the same tool.
# Where the PHB gives a proficiency but NOT the item (Outlander's instrument, Criminal's and
# Soldier's gaming set), the pick has no also_give.

criminal:
  name: Criminal
  description: "You are an experienced criminal with a history of breaking the law — a thief, smuggler, fence, or worse — and you have contacts in the underworld."
  skill_proficiencies: [deception, stealth]
  tool_proficiencies: [thieves_tools]
  starting_equipment:
    - crowbar
    - common_clothes        # dark, with a hood
    - gold_piece x15
  player_choices:
    - id: background_gaming_set
      title: Gaming Set Proficiency
      type: tool
      choose: 1
      options: [gaming_set]
  feature:
    name: Criminal Contact
    description: "You have a reliable and trustworthy contact who acts as your liaison to a network of other criminals. You know how to get messages to and from your contact, even over great distances — through local messengers, corrupt caravan masters, and seedy sailors."
  links: ["https://dnd5e.wikidot.com/background:criminal"]

entertainer:
  name: Entertainer
  description: "You thrive in front of an audience. You know how to entrance, entertain, and inspire them — music, dance, acting, storytelling, or any other art."
  skill_proficiencies: [acrobatics, performance]
  tool_proficiencies: [disguise_kit]
  starting_equipment:
    - favor_of_an_admirer
    - costume
    - gold_piece x15
  player_choices:
    - id: background_instrument
      title: Musical Instrument
      type: tool
      choose: 1
      options: [musical_instrument]
      also_give: true         # the instrument you're proficient with is the one you carry
  feature:
    name: By Popular Demand
    description: "You can always find a place to perform — an inn, tavern, circus, theater, or noble court. There you receive free lodging and food of a modest or comfortable standard, as long as you perform each night. You become a local figure, recognized by strangers in towns you've played."
  links: ["https://dnd5e.wikidot.com/background:entertainer"]

folk_hero:
  name: Folk Hero
  description: "You come from a humble social rank, but you are destined for so much more. The people of your home village regard you as their champion."
  skill_proficiencies: [animal_handling, survival]
  tool_proficiencies: [vehicles_land]
  starting_equipment:
    - shovel
    - iron_pot
    - common_clothes
    - gold_piece x10
  player_choices:
    - id: background_artisan_tool
      title: Artisan's Tools
      type: tool
      choose: 1
      options: [artisan_tool]
      also_give: true
  feature:
    name: Rustic Hospitality
    description: "Since you come from the ranks of the common folk, you fit in among them with ease. You can find a place to hide, rest, or recuperate among other commoners, unless you have shown yourself to be a danger to them. They will shield you from the law or anyone else searching for you, though they won't risk their lives for you."
  links: ["https://dnd5e.wikidot.com/background:folk-hero"]

guild_artisan:
  name: Guild Artisan
  description: "You are a member of an artisan's guild, skilled in a particular field and closely associated with other artisans."
  skill_proficiencies: [insight, persuasion]
  starting_equipment:
    - letter_of_introduction
    - travelers_clothes
    - gold_piece x15
  player_choices:
    - id: background_artisan_tool
      title: Artisan's Tools
      type: tool
      choose: 1
      options: [artisan_tool]
      also_give: true
    - id: background_language
      title: Background Language
      type: language
      choose: 1
      options: []
  feature:
    name: Guild Membership
    description: "Your guild will provide you with lodging and food if necessary, and pay for your funeral if needed. Guildhalls offer a place to meet patrons and allies, and the guild can give you access to powerful political figures. You must pay dues of 5 gp per month to remain in good standing."
  links: ["https://dnd5e.wikidot.com/background:guild-artisan"]

hermit:
  name: Hermit
  description: "You lived in seclusion — in a sheltered community such as a monastery, or entirely alone — for a formative part of your life."
  skill_proficiencies: [medicine, religion]
  tool_proficiencies: [herbalism_kit]
  starting_equipment:
    - scroll_case_of_notes
    - winter_blanket
    - common_clothes
    - herbalism_kit
    - gold_piece x5
  player_choices:
    - id: background_language
      title: Background Language
      type: language
      choose: 1
      options: []
  feature:
    name: Discovery
    description: "The quiet seclusion of your extended hermitage gave you access to a unique and powerful discovery — a great truth about the cosmos, a hidden site, a forgotten fact. Work out its nature with your DM."
  links: ["https://dnd5e.wikidot.com/background:hermit"]

outlander:
  name: Outlander
  description: "You grew up in the wilds, far from civilization and the comforts of town and technology."
  skill_proficiencies: [athletics, survival]
  starting_equipment:
    - quarterstaff          # "a staff"
    - hunting_trap
    - animal_trophy
    - travelers_clothes
    - gold_piece x10
  player_choices:
    - id: background_instrument
      title: Musical Instrument Proficiency
      type: tool
      choose: 1
      options: [musical_instrument]   # proficiency only — the PHB kit has no instrument
    - id: background_language
      title: Background Language
      type: language
      choose: 1
      options: []
  feature:
    name: Wanderer
    description: "You have an excellent memory for maps and geography, and can always recall the general layout of terrain, settlements, and other features around you. You can find food and fresh water for yourself and up to five other people each day, provided the land offers berries, small game, water, and so forth."
  links: ["https://dnd5e.wikidot.com/background:outlander"]

sage:
  name: Sage
  description: "You spent years learning the lore of the multiverse — scouring manuscripts, studying scrolls, and listening to the greatest experts."
  skill_proficiencies: [arcana, history]
  starting_equipment:
    - bottle_of_ink
    - ink_pen               # a quill
    - small_knife
    - letter_from_dead_colleague
    - common_clothes
    - gold_piece x10
  player_choices:
    - id: background_language
      title: Background Languages
      type: language
      choose: 2
      options: []
  feature:
    name: Researcher
    description: "When you attempt to learn or recall a piece of lore, if you don't know it, you often know where and from whom you can obtain it — a library, a scriptorium, a university, or a sage. Your DM might rule the knowledge is hidden somewhere nearly inaccessible."
  links: ["https://dnd5e.wikidot.com/background:sage"]

soldier:
  name: Soldier
  description: "War has been your life for as long as you care to remember. You trained, served in a militia or army, and learned to survive on the battlefield."
  skill_proficiencies: [athletics, intimidation]
  tool_proficiencies: [vehicles_land]
  starting_equipment:
    - insignia_of_rank
    - battle_trophy
    - common_clothes
    - gold_piece x10
  player_choices:
    - id: background_gaming_set
      title: Gaming Set Proficiency
      type: tool
      choose: 1
      options: [gaming_set]
    # The kit's "set of bone dice or deck of cards" is gear, separate from the proficiency above.
    - id: soldier_game
      title: Bone Dice or Deck of Cards
      type: equipment
      choose: 1
      options:
        - dice_set
        - playing_card_set
  feature:
    name: Military Rank
    description: "You have a military rank from your career as a soldier. Soldiers loyal to your former organization still recognize your authority and influence, and defer to you if they are of lower rank. You can invoke your rank to exert influence and to requisition simple equipment or horses for temporary use, and you can usually gain access to friendly military encampments and fortresses."
  links: ["https://dnd5e.wikidot.com/background:soldier"]
