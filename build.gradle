plugins {
    id 'java'
}

group = 'org.plugin'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.129-stable")

    // Tests (#14). Never bundled into the plugin jar. Paper is on the test classpath because the
    // model classes touch Bukkit types (Material, Component); the loaders and character math run
    // fine without a server, which is exactly what the tests cover.
    testImplementation("io.papermc.paper:paper-api:26.2.build.129-stable")
    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
    // Tests load the repo's real DMContent/ (relative to the project dir), so content regressions
    // fail the build. Keep the loaders' INFO chatter out of the output; failures still print in full.
    systemProperty "java.util.logging.config.file", "${projectDir}/src/test/resources/logging.properties"
    // The tests read DMContent at runtime; without this Gradle treats a YAML-only edit as "nothing
    // changed" and skips the tests as up to date, so a broken content file would build green.
    inputs.dir("DMContent").withPropertyName("dmContent")
    testLogging {
        events("failed")
        exceptionFormat = "full"
    }
}

// Paper 26.x needs Java 25. The toolchain builds and tests with it whatever Java runs Gradle
// (settings.gradle's foojay resolver downloads it if it's missing).
def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = "UTF-8"
    filesMatching('plugin.yml') {
        expand props
    }
}
