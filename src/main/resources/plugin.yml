name: jkvttplugin
version: '1.0-SNAPSHOT'
main: io.papermc.jkvttplugin.JkVttPlugin
api-version: '1.21'
commands:
  character:
    description: Character commands (create, view, list, close, rest, give).
    usage: /character <create|view|list|close|rest|give>
    aliases: [char]
  roll:
    description: Roll dice using XdY format (e.g., 2d6+3).
    usage: /roll <XdY[+Z]>
    permission: dnd.rolldice
  combat:
    description: (DM) Combat session management commands.
    usage: /combat <start|add|remove|nextturn|endturn|finished|...>
    # Authorization handled in-command: DMs get full control, players get their
    # own-turn subcommands (see PLAYER_ALLOWED in CombatCommand).
  dmentity:
    description: (DM) Spawn and manage entities in the world.
    usage: /dmentity <spawn|list|remove|teleport|info|trade|spawngroup|shop|cleanup>
    # Authorization handled in-command via DMManager.isDM (op or /dm add), so
    # non-op DMs work. A plugin.yml permission would default to op-only and block them.
  dm:
    description: DM role management and DM admin tools.
    usage: /dm <add|remove|list|give|check|rest|resource|reload>
    permission-message: Only server operators can manage DMs.
