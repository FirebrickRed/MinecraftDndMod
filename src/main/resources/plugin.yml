name: jkvttplugin
version: '1.0-SNAPSHOT'
main: io.papermc.jkvttplugin.JkVttPlugin
api-version: '1.21'
commands:
  character:
    description: Character commands (create, view, list, rest, give, delete, loot, check, cast, drink, reply).
    usage: /character <create|view|list|rest|give|delete|loot|check|cast|drink|reply>
  roll:
    description: Roll dice using XdY format (e.g., 2d6+3).
    usage: /roll <XdY[+Z]>
    # No permission node: `dnd.rolldice` was declared here but never defined with a default, so
    # Bukkit treated it as op-only and ordinary players couldn't roll dice at all.
  combat:
    description: (DM) Combat session management commands.
    usage: /combat <start|add|remove|nextturn|endturn|finished|...>
    # Authorization handled in-command: DMs get full control, players get their
    # own-turn subcommands (see PLAYER_ALLOWED in CombatCommand).
  dm:
    description: DM role management and DM admin tools.
    usage: /dm <add|remove|list|give|check|hp|revive|entity|object|rest|resource|reload|mode>
    # Authorization is in-command (DMManager.isDM), so there's no permission node here — a
    # plugin.yml permission would default to op-only and lock out /dm add DMs.
