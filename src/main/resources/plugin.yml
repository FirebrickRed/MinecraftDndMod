name: jkvttplugin
version: '1.0-SNAPSHOT'
main: io.papermc.jkvttplugin.JkVttPlugin
api-version: '1.21'
commands:
  character:
    description: Character commands (create, view, list, close, rest, give, delete, loot, check, cast, reply).
    usage: /character <create|view|list|close|rest|give|delete|loot|check|cast|reply>
  roll:
    description: Roll dice using XdY format (e.g., 2d6+3).
    usage: /roll <XdY[+Z]>
    permission: dnd.rolldice
  combat:
    description: (DM) Combat session management commands.
    usage: /combat <start|add|remove|nextturn|endturn|finished|...>
    # Authorization handled in-command: DMs get full control, players get their
    # own-turn subcommands (see PLAYER_ALLOWED in CombatCommand).
  dm:
    description: DM role management and DM admin tools.
    usage: /dm <add|remove|list|give|check|hp|revive|entity|object|rest|resource|reload|mode>
    permission-message: Only server operators can manage DMs.
