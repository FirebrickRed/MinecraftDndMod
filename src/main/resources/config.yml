# jkvttplugin configuration

rolls:
  # How d20 rolls resolve when a player doesn't supply their own result.
  #   physical = players roll their real dice; the game prompts them to enter the number
  #   auto     = the game rolls the d20 for the player
  # Either way, players may always type their own result (--roll) or a final total (--total).
  mode: physical

# Ritual casting during combat (#156). By the book a ritual adds 10 minutes (~100 rounds),
# so it never finishes in a fight — this is a playable house rule instead.
rituals:
  # How many of the caster's turns a ritual takes to complete when channelled in combat.
  # A spell may override this with its own `ritual_rounds:` in its YAML.
  combat_rounds: 10
  # What breaks the channel when the caster takes damage:
  #   concentration_check = CON save or the ritual is lost (default)
  #   break_on_damage     = any damage breaks it outright
  #   none                = damage never breaks it
  interrupt: concentration_check
  # Concentration DC used by concentration_check. 0 = the 5e default of max(10, half the damage).
  # Set a fixed number (e.g. 10) to pin a "deep concentration" DC for a specific table/encounter.
  interrupt_dc: 0

# Character-creation options.
abilities:
  # Ability-score roll helper on the creation Abilities tab (#59). REFERENCE ONLY — the button
  # rolls a set of six and shows the numbers so you can enter them yourself; nothing is auto-set.
  # Left-click rerolls; right-click switches method (only when more than one is listed).
  # Options: 4d6_drop_lowest (heroic), 3d6 (classic), 1d20 (wild house rule).
  # List just one to lock the method (no toggle), or leave the list empty to hide the helper.
  roll_methods:
    - 4d6_drop_lowest
    - 3d6
    - 1d20
